[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina"
version = "0.1.0"
description = "从本地文件萃取知识，生成结构化笔记的 AI Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ripple", email = "chenboripple@gmail.com"}
]
keywords = ["ai", "knowledge-base", "markdown", "obsidian", "llm", "note-taking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Environment :: Console",
]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "python-frontmatter>=1.0.0",
    "watchdog>=3.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
vector = [
    "chromadb>=1.0.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "sentence-transformers>=3.0.0",
]
pdf = [
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.23.0",
]
full = [
    "lumina[vector,pdf]",
]

[project.scripts]
lumina = "lumina.cli:cli"

[project.gui-scripts]
# 未来可添加 GUI 入口
# lumina-gui = "lumina.gui:main"

[project.urls]
Homepage = "https://github.com/chenboripple/Lumina"
Repository = "https://github.com/chenboripple/Lumina"
Issues = "https://github.com/chenboripple/Lumina/issues"
Documentation = "https://github.com/chenboripple/Lumina#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumina = ["templates/*.md", "config/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true